[project]
name = "kin-pipeline"
version = "0.1.0"
description = "Kin voice pipeline — Speechmatics + Thymia Sentinel bridge"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "thymia-sentinel>=1.1.0",
    "speechmatics-rt>=1.0.0",
    "speechmatics-voice[smart]>=0.1.28",
    "supabase>=2.8.0",
    "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kin_pipeline"]
